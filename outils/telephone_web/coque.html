<meta charset="utf-8">
<title>Téléphone de William</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Téléphone de William (outils/telephone.py assemble cette coque, outils/telephone_web/noyau.js et une feuille JS par application).
   Mise en page : une colonne de téléphone (430 px au plus) ; barre d'état en haut ; écran d'accueil (grille d'applications) ou
   application ouverte (en-tête avec retour) ; barre d'accueil en bas. */
:root {
  --fond: #e9eeec; --ecran: #fbfcfc; --encre: #17201f; --gris: #5b6a67; --trait: #d5dddb; --carte: #ffffff;
  --accent: #0b6e6a; --accent-doux: #d8eeeb; --bulle-moi: #d4ece8; --bulle-eux: #ffffff;
  --credit: #1c7a3c; --debit: #9a2b2b; --ferie: #8a5a00; --vacances: #e8f1fb; --vert: #1c7a3c; --orange: #a35a00; --rouge: #b42318;
  --vert-doux: #dff3e6; --orange-doux: #fdebd3; --rouge-doux: #fde2df;
  --app-messages: #2f8f5b; --app-courriels: #3b63c4; --app-banque: #0b6e6a; --app-calendrier: #c2410c; --app-meteo: #0e7490;
  --app-voyages: #6d3fd1; --app-rencontres: #be185d; --app-sante: #15803d; --sur-app: #ffffff; --badge: #d92d20;
  --ui: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --chiffres: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fond: #0b1110; --ecran: #111918; --encre: #e4ecea; --gris: #92a29f; --trait: #23302e; --carte: #172120;
  --accent: #46b9b0; --accent-doux: #173533; --bulle-moi: #1c3a37; --bulle-eux: #1a2524;
  --credit: #6fcf8e; --debit: #f08d8d; --ferie: #e0b45a; --vacances: #16263a; --vert: #6fcf8e; --orange: #f0b45a; --rouge: #f08d8d;
  --vert-doux: #15301f; --orange-doux: #3a2a12; --rouge-doux: #3a1a17; color-scheme: dark } }
:root[data-theme="dark"] {
  --fond: #0b1110; --ecran: #111918; --encre: #e4ecea; --gris: #92a29f; --trait: #23302e; --carte: #172120;
  --accent: #46b9b0; --accent-doux: #173533; --bulle-moi: #1c3a37; --bulle-eux: #1a2524;
  --credit: #6fcf8e; --debit: #f08d8d; --ferie: #e0b45a; --vacances: #16263a; --vert: #6fcf8e; --orange: #f0b45a; --rouge: #f08d8d;
  --vert-doux: #15301f; --orange-doux: #3a2a12; --rouge-doux: #3a1a17; color-scheme: dark }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--fond); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
.telephone { max-width: 430px; margin-inline: auto; min-height: 100%; background: var(--ecran); display: flex; flex-direction: column;
  border-inline: 1px solid var(--trait); }
.etat { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--ecran); display: flex; justify-content: space-between;
  align-items: center; padding: 10px 16px 8px; font-family: var(--chiffres); font-size: 13px; border-bottom: 1px solid var(--trait); gap: 12px; }
.etat .reseau { color: var(--gris); letter-spacing: .04em; }
/* écran d'accueil */
.accueil { flex: 1; padding: 28px 16px 96px; display: grid; gap: 28px; align-content: start; }
.horloge { display: grid; justify-items: center; gap: 2px; text-align: center; }
.horloge .grande { font-family: var(--chiffres); font-size: 64px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.horloge .longue { font-size: 16px; font-weight: 600; }
.horloge .mini { color: var(--gris); font-size: 14px; }
.grille-applis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 10px; }
.tuile { appearance: none; border: 0; background: none; padding: 0; display: grid; justify-items: center; gap: 7px; cursor: pointer; min-width: 0; }
.tuile .pastille { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; color: var(--sur-app); position: relative;
  box-shadow: 0 1px 2px rgb(0 0 0 / .18); }
.tuile .pastille svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tuile .nom { font-size: 12px; font-weight: 600; text-align: center; overflow-wrap: anywhere; }
.tuile .badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--badge);
  color: var(--sur-app); font: 600 11px/20px var(--chiffres); padding: 0 5px; }
.tuile:focus-visible .pastille, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* application ouverte */
.appli { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.entete { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; }
.entete .retour-accueil { appearance: none; border: 1px solid var(--trait); background: var(--carte); color: var(--accent); width: 36px; height: 36px;
  border-radius: 18px; font-size: 20px; line-height: 1; cursor: pointer; flex: none; }
.entete h1 { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; }
.entete p { margin: 0; color: var(--gris); font-size: 14px; }
main { flex: 1; padding: 6px 16px 96px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.barre-accueil { position: sticky; bottom: 0; appearance: none; border: 0; background: var(--ecran); border-top: 1px solid var(--trait); cursor: pointer;
  padding: 10px 0 calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; place-items: center; }
.barre-accueil span { width: 120px; height: 5px; border-radius: 3px; background: var(--encre); opacity: .55; }
/* éléments communs */
.liste { display: grid; border-top: 1px solid var(--trait); }
.liste > * { border-bottom: 1px solid var(--trait); }
.liste button { appearance: none; border: 0; background: none; text-align: left; width: 100%; cursor: pointer; padding: 0; }
.ligne { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 2px; min-width: 0; }
.ligne .titre { font-weight: 600; overflow-wrap: anywhere; }
.ligne .sous { color: var(--gris); font-size: 14px; grid-column: 1 / -1; overflow-wrap: anywhere; }
.ligne .quand, .montant, .temp { font-family: var(--chiffres); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--gris); white-space: nowrap; }
.montant.credit { color: var(--credit); } .montant.debit { color: var(--debit); }
.vide { color: var(--gris); padding: 28px 4px; text-align: center; display: grid; gap: 6px; }
.vide strong { color: var(--encre); font-size: 16px; }
.carte { background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 14px; display: grid; gap: 6px; min-width: 0; }
.solde .chiffre { font-family: var(--chiffres); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
.solde .nom, .etiquette { color: var(--gris); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.soldes { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.sec { margin: 8px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--gris); font-weight: 700; }
.note { color: var(--gris); font-size: 12px; margin: 0; }
.retour { appearance: none; border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px 0; cursor: pointer; justify-self: start; }
.puce { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ferie); }
.bouton { appearance: none; border: 1px solid var(--accent); background: var(--accent); color: var(--ecran); border-radius: 10px; padding: 9px 14px;
  font-weight: 600; cursor: pointer; justify-self: start; }
.bouton.discret { background: none; color: var(--accent); }
.bouton:disabled { opacity: .4; cursor: default; }
/* messages */
.fil { display: grid; gap: 8px; }
.bulle { max-width: 82%; padding: 8px 11px; border-radius: 14px; background: var(--bulle-eux); border: 1px solid var(--trait); overflow-wrap: anywhere; white-space: pre-wrap; }
.bulle.moi { justify-self: end; background: var(--bulle-moi); border-color: transparent; }
.bulle small { display: block; font-family: var(--chiffres); font-size: 11px; color: var(--gris); margin-top: 3px; }
.jour-sep { justify-self: center; font-size: 12px; color: var(--gris); text-transform: uppercase; letter-spacing: .06em; }
/* météo */
.maintenant { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.maintenant .grand { font-family: var(--chiffres); font-size: 54px; font-weight: 500; line-height: 1; }
.previsions { display: grid; border-top: 1px solid var(--trait); }
.prev { display: grid; grid-template-columns: 7.5em 1fr auto auto; gap: 10px; align-items: center; padding: 11px 2px; border-bottom: 1px solid var(--trait); }
.prev .pluie { font-family: var(--chiffres); font-size: 12px; color: var(--accent); }
/* calendrier */
.cal-nav { display: flex; align-items: center; gap: 8px; }
.cal-nav .mois { flex: 1; font-weight: 700; font-size: 17px; text-transform: capitalize; }
.cal-nav button { appearance: none; border: 1px solid var(--trait); background: var(--carte); border-radius: 10px; min-width: 38px; height: 34px;
  cursor: pointer; color: var(--accent); font-weight: 600; padding: 0 10px; }
.cal-nav button:disabled { opacity: .35; cursor: default; }
.cal-grille { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-jsem { text-align: center; font-size: 11px; font-weight: 700; color: var(--gris); padding: 4px 0; }
.cal-jour { appearance: none; border: 1px solid transparent; background: none; border-radius: 10px; min-height: 46px; padding: 4px 0;
  display: grid; justify-items: center; align-content: start; gap: 3px; cursor: pointer; font-variant-numeric: tabular-nums; }
.cal-jour.vacances { background: var(--vacances); }
.cal-jour.ferie .num { color: var(--ferie); font-weight: 700; }
.cal-jour.passe { opacity: .45; }
.cal-jour.auj { border-color: var(--accent); }
.cal-jour.choisi { background: var(--accent); color: var(--ecran); }
.cal-jour.choisi .num { color: var(--ecran); }
.cal-jour .num { font-size: 14px; font-weight: 600; }
.points { display: flex; gap: 3px; min-height: 6px; }
.pt { width: 6px; height: 6px; border-radius: 3px; display: block; }
.pt.rdv { background: var(--accent); } .pt.public { background: var(--app-voyages); } .pt.argent { background: var(--gris); }
.pt.ecole { background: var(--app-calendrier); } .pt.ferie { background: var(--ferie); }
.cal-jour.choisi .pt { outline: 1px solid var(--ecran); }
.legende { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--gris); }
.legende span { display: inline-flex; align-items: center; gap: 5px; }
.legende .bande { width: 14px; height: 10px; border-radius: 3px; background: var(--vacances); border: 1px solid var(--trait); }
/* voyages */
.onglets-appli { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--accent-doux); border-radius: 12px; padding: 3px; gap: 3px; }
.onglets-appli button { appearance: none; border: 0; background: none; border-radius: 9px; padding: 8px 2px; font-size: 13px; font-weight: 600;
  cursor: pointer; color: var(--gris); }
.onglets-appli button[aria-selected="true"] { background: var(--carte); color: var(--encre); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.formulaire { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.champ { display: grid; gap: 4px; min-width: 0; }
.champ.large { grid-column: 1 / -1; }
.champ label { font-size: 12px; font-weight: 600; color: var(--gris); text-transform: uppercase; letter-spacing: .05em; }
.champ select, .champ input { width: 100%; min-width: 0; border: 1px solid var(--trait); background: var(--carte); border-radius: 10px; padding: 8px 10px; }
.vol { display: grid; gap: 8px; }
.vol .haut { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.vol .compagnie { font-weight: 700; }
.vol .prix { font-family: var(--chiffres); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.trajet { display: grid; grid-template-columns: 4.2em 1fr; gap: 2px 8px; font-size: 14px; }
.trajet .sens { color: var(--gris); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; padding-top: 2px; }
.trajet .h { font-family: var(--chiffres); font-variant-numeric: tabular-nums; font-size: 13px; }
.prix-grille .cal-jour { min-height: 52px; }
.prix-grille .cal-jour .p { font-family: var(--chiffres); font-size: 10px; letter-spacing: -.02em; }
.prix-grille .cal-jour.vert { background: var(--vert-doux); } .prix-grille .cal-jour.vert .p { color: var(--vert); }
.prix-grille .cal-jour.orange { background: var(--orange-doux); } .prix-grille .cal-jour.orange .p { color: var(--orange); }
.prix-grille .cal-jour.rouge { background: var(--rouge-doux); } .prix-grille .cal-jour.rouge .p { color: var(--rouge); }
.prix-grille .cal-jour.sans { opacity: .35; }
.prix-grille .cal-jour.choisi { background: var(--accent); } .prix-grille .cal-jour.choisi .p, .prix-grille .cal-jour.choisi .num { color: var(--ecran); }
.copie { width: 100%; min-height: 90px; border: 1px solid var(--trait); border-radius: 10px; background: var(--carte); padding: 8px; font-size: 13px; }
.formalites { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.formalites li { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 12px; }
.rangee { display: flex; flex-wrap: wrap; gap: 8px; }
.onglets-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.haut-ligne { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.avatar { width: 46px; height: 46px; border-radius: 23px; display: grid; place-items: center; color: var(--sur-app); font-weight: 700; font-size: 20px; flex: none; }
.profil-tete { display: flex; gap: 12px; align-items: center; min-width: 0; }
.profil-tete > div { display: grid; gap: 2px; min-width: 0; }
.bio { margin: 0; overflow-wrap: anywhere; }
.puce.match { color: var(--app-rencontres); }
.barres { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; align-items: end; height: 120px; padding-top: 6px; }
.barres span { background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; display: block; }
.barres span.court { background: var(--orange); }
.jauge { height: 6px; border-radius: 3px; background: var(--accent-doux); overflow: hidden; }
.jauge span { display: block; height: 100%; background: var(--accent); }
.axe { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; font-size: 10px; color: var(--gris); text-align: center; font-family: var(--chiffres); }
@media (prefers-reduced-motion: no-preference) { main > *, .accueil > * { animation: entree .18s ease-out both; } }
@keyframes entree { from { opacity: .4; transform: translateY(3px); } to { opacity: 1; transform: none; } }
</style>
<div class="telephone">
  <div class="etat" role="status"><span id="heure"></span><span id="date"></span><span class="reseau" id="reseau"></span></div>
  <section id="accueil" class="accueil" aria-label="Écran d'accueil">
    <div class="horloge"><span class="grande" id="grande-heure"></span><span class="longue" id="date-longue"></span><span class="mini" id="meteo-mini"></span></div>
    <nav class="grille-applis" id="grille-applis" aria-label="Applications"></nav>
  </section>
  <section id="appli" class="appli" hidden>
    <div class="entete"><button class="retour-accueil" id="retour" aria-label="Revenir à l'écran d'accueil">‹</button>
      <div><h1 id="titre"></h1><p id="soustitre"></p></div></div>
    <main id="contenu" tabindex="-1"></main>
  </section>
  <button class="barre-accueil" id="barre-accueil" aria-label="Écran d'accueil"><span></span></button>
</div>
